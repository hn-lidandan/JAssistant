server:
  port: 8081
  servlet:
    context-path: /jassistant


spring:
  application:
    name: JAssistant

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ja_ssistant?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    baseline-version: 1.0.101
    encoding: UTF-8

  ai:
    model:
      chat: openai
#    deepseek:
#      api-key: ${DEEPSEEK_API_KEY:}
#      chat:
#        options:
#          model: deepseek-v4-pro
#          temperature: 0.7
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: deepseek-v4-pro
          temperature: 0.7

logging:
  level:
    root: info
    org.com.it.jassistant: debug

jassistant:
  ai:
    system-prompt: 你是ai智能助手，你的名字是事事
